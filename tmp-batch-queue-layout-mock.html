<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwiftMask — Batch queue layout mocks</title>
  <style>
    :root {
      --floral-white: #fffcf2;
      --dust-grey: #ccc5b9;
      --charcoal-brown: #403d39;
      --carbon-black: #252422;
      --spicy-paprika: #eb5e28;

      --bg: var(--carbon-black);
      --bg-rail: color-mix(in srgb, var(--charcoal-brown) 70%, var(--carbon-black));
      --bg-preview: color-mix(in srgb, #000 30%, var(--carbon-black));
      --bg-elevated: var(--charcoal-brown);
      --fg: var(--floral-white);
      --fg-muted: var(--dust-grey);
      --border: color-mix(in srgb, var(--floral-white) 14%, transparent);
      --accent: var(--spicy-paprika);
      --accent-hover: color-mix(in srgb, var(--floral-white) 22%, var(--spicy-paprika));
      --accent-fg: var(--floral-white);
      --danger: #ef4444;
      --success: #4ade80;
      --warn: #c9a86c;
      --radius: 8px;
      --rail-width: 300px;
      --titlebar-height: 40px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--fg);
      background: #121110;
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg: var(--floral-white);
      --bg-rail: color-mix(in srgb, var(--dust-grey) 35%, var(--floral-white));
      --bg-preview: color-mix(in srgb, var(--dust-grey) 55%, var(--floral-white));
      --bg-elevated: color-mix(in srgb, var(--floral-white) 55%, #ffffff);
      --fg: var(--carbon-black);
      --fg-muted: var(--charcoal-brown);
      --border: color-mix(in srgb, var(--carbon-black) 14%, transparent);
      --accent: var(--spicy-paprika);
      --accent-hover: color-mix(in srgb, var(--carbon-black) 22%, var(--spicy-paprika));
      --accent-fg: var(--floral-white);
      --danger: #b42318;
      --success: #15803d;
      --warn: #8a6d3b;
      --shadow: 0 8px 32px color-mix(in srgb, var(--carbon-black) 22%, transparent);
      background: #e8e4db;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      padding: 28px 24px 48px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent),
        #121110;
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent),
        #e8e4db;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 0.5em 0.9em;
      background: var(--bg-elevated);
      transition: border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-fg);
    }
    button.btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: transparent;
    }
    button.btn-ghost { background: transparent; }
    button.btn-danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
    }
    button:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }

    .page-header {
      max-width: 1220px;
      margin: 0 auto 22px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .page-header h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .page-header p {
      margin: 0;
      color: var(--fg-muted);
      max-width: 62ch;
    }
    .page-header .hint {
      margin-top: 10px;
      font-size: 0.85rem;
      color: color-mix(in srgb, var(--fg-muted) 80%, var(--accent));
    }
    .theme-toggle {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.4em 0.75em;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .option-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 1220px;
      margin: 0 auto 16px;
      align-items: center;
    }
    .option-tabs button {
      border-radius: 999px;
      padding: 0.45em 0.95em;
      background: color-mix(in srgb, var(--bg-elevated) 70%, transparent);
      font-size: 0.9rem;
    }
    .option-tabs button[aria-selected="true"] {
      background: var(--accent);
      border-color: transparent;
      color: var(--accent-fg);
      font-weight: 600;
    }
    .option-tabs .sim-btn {
      margin-left: auto;
      border-radius: var(--radius);
      font-size: 0.85rem;
    }

    .stage {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .stage { grid-template-columns: 1fr; }
    }

    /* Fake app window */
    .app-window {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--bg);
      height: min(640px, 78vh);
      min-height: 520px;
      display: grid;
      grid-template-rows: var(--titlebar-height) minmax(0, 1fr);
      grid-template-columns: minmax(220px, var(--rail-width)) minmax(0, 1fr);
      grid-template-areas:
        "rail titlebar"
        "rail preview";
    }

    .titlebar {
      grid-area: titlebar;
      display: flex;
      align-items: center;
      gap: 4px;
      height: var(--titlebar-height);
      padding: 0 6px 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-preview);
      user-select: none;
      min-width: 0;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 0 1 auto;
    }
    .titlebar-drag { flex: 1 1 auto; min-width: 24px; height: 100%; }
    .titlebar-right {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 0 0 auto;
    }
    .ep-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.15em 0.5em;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--fg-muted);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2rem;
      padding: 0;
      background: transparent;
      border-color: transparent;
      color: var(--fg-muted);
      border-radius: 6px;
    }
    .btn-icon:hover {
      color: var(--fg);
      background: color-mix(in srgb, var(--fg) 10%, transparent);
      border-color: transparent;
    }
    .btn-icon svg { width: 16px; height: 16px; }

    .app-rail {
      grid-area: rail;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg-rail);
      overflow: hidden;
      min-width: 0;
    }
    .app-rail-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 12px 8px;
      color: var(--fg);
      font-weight: 700;
      letter-spacing: -0.03em;
      font-size: 1.05rem;
      gap: 8px;
      flex: 0 0 auto;
    }
    .app-rail-brand .mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }
    .app-rail-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-rail-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 12px 12px;
    }
    .rail-footer {
      flex: 0 0 auto;
      padding: 10px 12px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: color-mix(in srgb, var(--bg-rail) 80%, #000);
    }
    .rail-section-label {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-muted);
      margin: 0 0 6px;
    }

    .folder-source {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      background: color-mix(in srgb, var(--bg-elevated) 55%, transparent);
    }
    .folder-source.compact {
      padding: 8px 10px;
    }
    .folder-path {
      font-size: 0.8rem;
      font-weight: 600;
      word-break: break-all;
      margin: 0 0 4px;
      line-height: 1.3;
    }
    .folder-out {
      font-size: 0.72rem;
      color: var(--fg-muted);
      margin: 0 0 8px;
      word-break: break-all;
    }
    .folder-out code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      color: color-mix(in srgb, var(--fg-muted) 70%, var(--accent));
    }
    .watch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .watch-row label {
      font-size: 0.85rem;
      color: var(--fg-muted);
      cursor: pointer;
      user-select: none;
    }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--fg) 12%, transparent);
      padding: 0;
      flex: 0 0 auto;
    }
    .toggle[aria-checked="true"] {
      background: var(--accent);
      border-color: transparent;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--fg);
      transition: transform 0.15s var(--ease-out);
    }
    .toggle[aria-checked="true"]::after {
      transform: translateX(16px);
      background: white;
    }

    .mode-block {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      background: color-mix(in srgb, var(--bg-elevated) 40%, transparent);
    }
    .mode-block.compact { padding: 8px; }
    .mode-block select {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 0.45em 0.7em;
      background: var(--bg-elevated);
      color: var(--fg);
    }
    .process-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .process-block .btn-primary,
    .process-block .btn-danger { width: 100%; font-weight: 600; }
    .process-note {
      font-size: 0.75rem;
      color: var(--fg-muted);
      text-align: center;
    }
    .process-status {
      font-size: 0.8rem;
      color: var(--fg-muted);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .process-status strong {
      color: var(--fg);
      font-weight: 600;
    }

    /* Queue list */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }
    .queue-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .queue-list-header .count {
      font-size: 0.72rem;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
    }
    .queue-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      width: 100%;
      cursor: pointer;
      min-height: 36px;
    }
    .queue-row:hover {
      background: color-mix(in srgb, var(--fg) 6%, transparent);
      border-color: transparent;
    }
    .queue-row.selected {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .queue-row.failed {
      border-color: color-mix(in srgb, var(--danger) 28%, transparent);
    }
    .queue-status {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1;
      color: var(--fg-muted);
    }
    .queue-status.done { color: var(--success); }
    .queue-status.processing { color: var(--accent); }
    .queue-status.failed { color: var(--danger); }
    .queue-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.85rem;
    }
    .queue-meta {
      font-size: 0.7rem;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .queue-meta.error {
      color: var(--danger);
      max-width: 88px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-progress {
      height: 3px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--fg) 12%, transparent);
      overflow: hidden;
      margin-top: 3px;
      grid-column: 2 / -1;
    }
    .queue-progress > i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
    }
    .queue-row.has-progress {
      grid-template-rows: auto auto;
      align-items: start;
    }
    .queue-row.has-progress .queue-status {
      grid-row: 1 / span 2;
      align-self: center;
    }

    /* Preview column */
    .preview {
      grid-area: preview;
      background: var(--bg-preview);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .preview-canvas {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
    }
    .preview-placeholder {
      width: min(380px, 100%);
      border: 1.5px dashed color-mix(in srgb, var(--fg-muted) 40%, transparent);
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
      background:
        linear-gradient(45deg, color-mix(in srgb, var(--fg) 4%, transparent) 25%, transparent 25%),
        linear-gradient(-45deg, color-mix(in srgb, var(--fg) 4%, transparent) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, color-mix(in srgb, var(--fg) 4%, transparent) 75%),
        linear-gradient(-45deg, transparent 75%, color-mix(in srgb, var(--fg) 4%, transparent) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: color-mix(in srgb, var(--bg) 50%, transparent);
    }
    .preview-placeholder-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .preview-placeholder-sub {
      margin: 0;
      font-size: 0.85rem;
      color: var(--fg-muted);
    }

    /* B: collapsible queue drawer under preview */
    .queue-drawer {
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-rail) 88%, var(--bg-preview));
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: max-height 0.22s var(--ease-out);
    }
    .queue-drawer-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 0;
      padding: 8px 12px;
      border: none;
      border-radius: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: var(--fg);
    }
    .queue-drawer-toggle:hover {
      background: color-mix(in srgb, var(--fg) 6%, transparent);
      border-color: transparent;
    }
    .queue-drawer-toggle .chev {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: var(--fg-muted);
      transition: transform 0.18s var(--ease-out);
      font-size: 0.75rem;
    }
    .queue-drawer.is-open .queue-drawer-toggle .chev {
      transform: rotate(180deg);
    }
    .queue-drawer-summary {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .queue-drawer-summary .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .queue-drawer-summary .title {
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .queue-drawer-summary .pill {
      font-size: 0.68rem;
      font-weight: 650;
      padding: 0.1em 0.45em;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      background: color-mix(in srgb, var(--bg-elevated) 70%, transparent);
      flex-shrink: 0;
    }
    .queue-drawer-summary .pill.live {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }
    .queue-drawer-summary .sub {
      font-size: 0.75rem;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .queue-drawer-body {
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 0 10px 10px;
      max-height: min(240px, 38vh);
      min-height: 0;
      border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }
    .queue-drawer.is-open .queue-drawer-body {
      display: flex;
    }
    .queue-drawer-body .queue-strip-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      max-height: min(200px, 32vh);
    }
    .queue-strip-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    /* D: split inside preview */
    .preview-split {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(160px, 38%) minmax(0, 1fr);
    }
    .preview-split-list {
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-rail) 70%, var(--bg-preview));
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 10px 8px;
    }
    .preview-split-list .queue-strip-scroll {
      flex: 1 1 auto;
      overflow: auto;
      min-height: 0;
    }
    .preview-split .preview-canvas {
      padding: 16px;
    }

    /* Notes panel */
    .notes {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg-elevated) 55%, transparent);
      padding: 14px 14px 16px;
      position: sticky;
      top: 16px;
    }
    .notes h2 {
      margin: 0 0 4px;
      font-size: 0.95rem;
      font-weight: 650;
    }
    .notes .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.15em 0.5em;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      color: var(--accent);
      margin-bottom: 10px;
    }
    .notes .badge.hidden { display: none; }
    .notes p.lead {
      margin: 0 0 12px;
      font-size: 0.85rem;
      color: var(--fg-muted);
    }
    .notes h3 {
      margin: 12px 0 6px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
    }
    .notes ul {
      margin: 0;
      padding-left: 1.1em;
      font-size: 0.85rem;
    }
    .notes li { margin: 0.25em 0; }
    .notes .pros li::marker { color: var(--success); }
    .notes .cons li::marker { color: var(--danger); }

    /* Toast */
    .toast-host {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: min(420px, calc(100% - 32px));
    }
    .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      animation: toast-in 0.2s var(--ease-out);
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div>
      <h1>SwiftMask — Batch queue layout options</h1>
      <p>
        Interactive shell mock for where the batch queue list lives. Switch A–D,
        select rows, toggle Watch, Process/Cancel, and simulate a run.
      </p>
      <p class="hint">Folder source: <code>/home/camilo/Pictures/product-shots</code> → <code>product-shots-nobg</code></p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="true" title="Toggle light/dark">
      Theme: Dark
    </button>
  </header>

  <div class="option-tabs" role="tablist" aria-label="Layout options">
    <button type="button" role="tab" id="tab-a" aria-selected="false" data-opt="A">A · Queue in left rail</button>
    <button type="button" role="tab" id="tab-b" aria-selected="true" data-opt="B">B · Collapsible under preview</button>
    <button type="button" role="tab" id="tab-c" aria-selected="false" data-opt="C">C · List-first rail</button>
    <button type="button" role="tab" id="tab-d" aria-selected="false" data-opt="D">D · Split preview</button>
    <button type="button" class="sim-btn" id="simRun">Simulate run</button>
  </div>

  <div class="stage">
    <div class="app-window" id="appWindow" aria-label="SwiftMask batch shell mock">
      <!-- filled by JS -->
    </div>

    <aside class="notes" id="notes" aria-live="polite">
      <!-- filled by JS -->
    </aside>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script>
    const FOLDER = "/home/camilo/Pictures/product-shots";
    const OUT_DIR = "product-shots-nobg";

    const NOTES = {
      A: {
        title: "A · Queue in left rail",
        recommended: false,
        lead: "Rail: brand → compact folder header → scrollable queue → Mode → Process. Main: preview of selected/running item.",
        pros: [
          "Queue always visible without shrinking canvas height",
          "Natural extension of today’s rail hierarchy",
          "Folder + Watch stay near list context",
        ],
        cons: [
          "Rail denser than single-image FileBlock",
          "Long names may truncate in 300px",
          "Mode slightly lower — one more scroll on short windows",
        ],
      },
      B: {
        title: "B · Collapsible queue under preview",
        recommended: true,
        lead: "Rail stays closer to today (source + mode + process). Preview column keeps a thin queue bar; expand to browse the full list, collapse to give canvas height back.",
        pros: [
          "Rail remains familiar for single-image users",
          "Collapsed bar shows counts / current item without eating the canvas",
          "Expand only when you need the list (errors, pin, retry)",
          "Canvas keeps full width",
        ],
        cons: [
          "One extra click to scan the full queue",
          "Expanded state still borrows vertical space",
          "Easy to forget the list is collapsed while failures pile up (mitigate: badge on bar)",
        ],
      },
      C: {
        title: "C · Queue is entire left rail",
        recommended: false,
        lead: "Mode + process compressed into rail footer; list dominates the rail. Similar to A but more list-first.",
        pros: [
          "Maximum list density for large batches",
          "Clear “this is a queue tool” mode",
          "Footer status always visible while scrolling list",
        ],
        cons: [
          "Folder/Watch and mode feel secondary",
          "Harder to discover non-queue controls",
          "Less continuity with single-image shell",
        ],
      },
      D: {
        title: "D · Split inside preview column",
        recommended: false,
        lead: "Rail stays mostly single-image-like. Preview area: vertical list | canvas side by side.",
        pros: [
          "List + preview co-located for selection",
          "Rail unchanged for Process muscle memory",
          "Works if queue is secondary to canvas",
        ],
        cons: [
          "Narrows canvas significantly",
          "Two vertical scroll regions compete",
          "Feels like a dual-pane editor, not a shell rail",
        ],
      },
    };

    /** @type {{ id: string, name: string, status: 'pending'|'processing'|'done'|'failed', progress?: number, stage?: string, error?: string }[]} */
    let items = [
      { id: "1", name: "photo-01.jpg", status: "processing", progress: 62, stage: "inferring" },
      { id: "2", name: "DSC_1042.JPG", status: "pending" },
      { id: "3", name: "hero-shot-front.png", status: "pending" },
      { id: "4", name: "packshot-red.tif", status: "failed", error: "Decode failed" },
      { id: "5", name: "IMG_2201.jpg", status: "pending" },
      { id: "6", name: "detail-label.webp", status: "pending" },
      { id: "7", name: "backdrop-soft.jpg", status: "pending" },
      { id: "8", name: "model-side-03.jpg", status: "pending" },
      { id: "9", name: "texture-closeup.png", status: "done" },
      { id: "10", name: "SKU-4481.jpg", status: "done" },
      { id: "11", name: "promo-banner.png", status: "done" },
      { id: "12", name: "swatch-grid.jpg", status: "done" },
    ];

    let selectedId = "1";
    let option = "B";
    let watching = false;
    let running = true;
    let queueDrawerOpen = false; // B: collapsed by default

    function sortItems(list) {
      const rank = { processing: 0, pending: 1, failed: 2, done: 3 };
      return [...list].sort((a, b) => {
        const d = rank[a.status] - rank[b.status];
        if (d !== 0) return d;
        return a.name.localeCompare(b.name);
      });
    }

    function counts() {
      const total = items.length;
      const done = items.filter((i) => i.status === "done").length;
      const processing = items.find((i) => i.status === "processing");
      return { total, done, processing };
    }

    function toast(msg) {
      const host = document.getElementById("toastHost");
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transition = "opacity 0.2s ease";
        setTimeout(() => el.remove(), 220);
      }, 2200);
    }

    function statusIcon(status) {
      if (status === "done") return "✓";
      if (status === "processing") return "◉";
      if (status === "failed") return "!";
      return "○";
    }

    function renderQueueRows(list, { compactMeta = false } = {}) {
      return list
        .map((item) => {
          const selected = item.id === selectedId ? " selected" : "";
          const failed = item.status === "failed" ? " failed" : "";
          const hasProgress = item.status === "processing" ? " has-progress" : "";
          let meta = "";
          if (item.status === "processing") {
            meta = `<span class="queue-meta">${item.progress ?? 0}%</span>`;
          } else if (item.status === "failed") {
            meta = `<span class="queue-meta error" title="${escapeHtml(item.error || "Error")}">${escapeHtml(item.error || "Error")}</span>`;
          } else if (item.status === "done") {
            meta = compactMeta ? "" : `<span class="queue-meta">done</span>`;
          } else {
            meta = compactMeta ? "" : `<span class="queue-meta">queued</span>`;
          }
          const progress =
            item.status === "processing"
              ? `<div class="queue-progress" aria-hidden="true"><i style="width:${item.progress ?? 0}%"></i></div>`
              : "";
          return `
            <button type="button" class="queue-row${selected}${failed}${hasProgress}" data-id="${item.id}" title="${escapeHtml(item.name)}">
              <span class="queue-status ${item.status}" aria-hidden="true">${statusIcon(item.status)}</span>
              <span class="queue-name">${escapeHtml(item.name)}</span>
              ${meta}
              ${progress}
            </button>`;
        })
        .join("");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function folderBlock(compact = false) {
      return `
        <div class="folder-source${compact ? " compact" : ""}">
          <p class="folder-path" title="${escapeHtml(FOLDER)}">${escapeHtml(FOLDER)}</p>
          <p class="folder-out">→ outputs <code>${escapeHtml(OUT_DIR)}</code></p>
          <div class="watch-row">
            <label for="watchToggle">Watch folder</label>
            <button type="button" class="toggle" id="watchToggle" role="switch" aria-checked="${watching}" aria-label="Watch folder"></button>
          </div>
        </div>`;
    }

    function modeBlock(compact = false) {
      return `
        <div class="mode-block${compact ? " compact" : ""}">
          <p class="rail-section-label">Mode</p>
          <select aria-label="Processing mode">
            <option selected>Quality</option>
            <option>Balanced</option>
            <option>Fast</option>
          </select>
        </div>`;
    }

    function processBlock() {
      const { total, done, processing } = counts();
      const statusText = running
        ? `<strong>${done}/${total}</strong> · ${processing ? (processing.stage || "inferring") + "…" : "running…"}`
        : `<strong>${done}/${total}</strong> · idle`;
      const action = running
        ? `<button type="button" class="btn-danger" id="processBtn">Cancel</button>`
        : `<button type="button" class="btn-primary" id="processBtn">Process folder</button>`;
      return `
        <div class="process-block">
          <p class="process-status">${statusText}</p>
          ${action}
          <p class="process-note">Local · writes to ${escapeHtml(OUT_DIR)}</p>
        </div>`;
    }

    function titlebarHtml() {
      return `
        <header class="titlebar">
          <div class="titlebar-left">
            <span class="ep-chip" title="Execution provider">CUDA</span>
          </div>
          <div class="titlebar-drag" aria-hidden="true"></div>
          <div class="titlebar-right">
            <button type="button" class="btn-icon" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            </button>
            <button type="button" class="btn-icon" title="Close" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </header>`;
    }

    function brandHtml() {
      return `
        <div class="app-rail-brand">
          <span class="mark">S</span>
          <span>SwiftMask</span>
        </div>`;
    }

    function previewPlaceholder() {
      const sel = items.find((i) => i.id === selectedId);
      const name = sel ? sel.name : "—";
      const sub =
        sel?.status === "processing"
          ? `${sel.stage || "inferring"} · ${sel.progress ?? 0}%`
          : sel?.status === "failed"
            ? sel.error || "Failed"
            : sel?.status === "done"
              ? "Complete"
              : "Queued";
      return `
        <div class="preview-placeholder">
          <p class="preview-placeholder-title">Preview · selected item</p>
          <p class="preview-placeholder-sub">${escapeHtml(name)} · ${escapeHtml(sub)}</p>
        </div>`;
    }

    function queueHeader(list) {
      return `
        <div class="queue-list-header">
          <p class="rail-section-label" style="margin:0">Queue</p>
          <span class="count">${list.length} items</span>
        </div>`;
    }

    function renderApp() {
      const list = sortItems(items);
      const win = document.getElementById("appWindow");
      let rail = "";
      let preview = "";

      if (option === "A") {
        rail = `
          ${brandHtml()}
          <div class="app-rail-body">
            <div class="app-rail-scroll">
              ${folderBlock(true)}
              <div class="queue-list">
                ${queueHeader(list)}
                ${renderQueueRows(list)}
              </div>
              ${modeBlock()}
            </div>
            <div class="rail-footer">
              ${processBlock()}
            </div>
          </div>`;
        preview = `
          <section class="preview">
            <div class="preview-canvas">${previewPlaceholder()}</div>
          </section>`;
      } else if (option === "B") {
        rail = `
          ${brandHtml()}
          <div class="app-rail-body">
            <div class="app-rail-scroll">
              ${folderBlock()}
              ${modeBlock()}
            </div>
            <div class="rail-footer">
              ${processBlock()}
            </div>
          </div>`;
        const c = counts();
        const failed = items.filter((i) => i.status === "failed").length;
        const pending = items.filter((i) => i.status === "pending").length;
        const current =
          list.find((i) => i.status === "processing") ||
          list.find((i) => i.id === selectedId) ||
          list[0];
        const subParts = [];
        if (c.processing) subParts.push(`${c.processing.name} · ${c.processing.progress ?? 0}%`);
        else if (current) subParts.push(current.name);
        if (failed) subParts.push(`${failed} failed`);
        if (pending && !c.processing) subParts.push(`${pending} pending`);
        const sub = subParts.join(" · ") || `${c.done}/${c.total} done`;
        const openClass = queueDrawerOpen ? " is-open" : "";
        preview = `
          <section class="preview">
            <div class="preview-canvas">${previewPlaceholder()}</div>
            <div class="queue-drawer${openClass}">
              <button type="button" class="queue-drawer-toggle" id="queueDrawerToggle" aria-expanded="${queueDrawerOpen}" title="${queueDrawerOpen ? "Collapse queue" : "Expand queue"}">
                <span class="chev" aria-hidden="true">▾</span>
                <span class="queue-drawer-summary">
                  <span class="title-row">
                    <span class="title">Queue</span>
                    <span class="pill${c.processing ? " live" : ""}">${c.done}/${c.total}${c.processing ? " · running" : failed ? ` · ${failed} failed` : " done"}</span>
                  </span>
                  <span class="sub">${escapeHtml(sub)}</span>
                </span>
              </button>
              <div class="queue-drawer-body" ${queueDrawerOpen ? "" : "hidden"}>
                <div class="queue-strip-scroll queue-list">
                  ${renderQueueRows(list)}
                </div>
              </div>
            </div>
          </section>`;
      } else if (option === "C") {
        rail = `
          ${brandHtml()}
          <div class="app-rail-body">
            <div class="app-rail-scroll" style="padding-top:4px">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
                <p class="folder-path" style="margin:0;font-size:0.75rem;flex:1;min-width:0" title="${escapeHtml(FOLDER)}">${escapeHtml(FOLDER.split("/").pop())}</p>
                <button type="button" class="toggle" id="watchToggle" role="switch" aria-checked="${watching}" aria-label="Watch folder" title="Watch folder"></button>
              </div>
              <div class="queue-list">
                ${queueHeader(list)}
                ${renderQueueRows(list)}
              </div>
            </div>
            <div class="rail-footer">
              ${modeBlock(true)}
              ${processBlock()}
            </div>
          </div>`;
        preview = `
          <section class="preview">
            <div class="preview-canvas">${previewPlaceholder()}</div>
          </section>`;
      } else {
        // D
        rail = `
          ${brandHtml()}
          <div class="app-rail-body">
            <div class="app-rail-scroll">
              ${folderBlock()}
              ${modeBlock()}
            </div>
            <div class="rail-footer">
              ${processBlock()}
            </div>
          </div>`;
        preview = `
          <section class="preview">
            <div class="preview-split">
              <div class="preview-split-list">
                ${queueHeader(list)}
                <div class="queue-strip-scroll queue-list">
                  ${renderQueueRows(list)}
                </div>
              </div>
              <div class="preview-canvas">${previewPlaceholder()}</div>
            </div>
          </section>`;
      }

      win.innerHTML = `
        <aside class="app-rail">${rail}</aside>
        ${titlebarHtml()}
        ${preview}
      `;

      bindAppEvents();
      renderNotes();
    }

    function bindAppEvents() {
      document.querySelectorAll(".queue-row").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedId = btn.getAttribute("data-id");
          const item = items.find((i) => i.id === selectedId);
          toast(`Pinned preview: ${item ? item.name : "item"}`);
          renderApp();
        });
      });

      const watch = document.getElementById("watchToggle");
      if (watch) {
        watch.addEventListener("click", () => {
          watching = !watching;
          toast(watching ? "Watch folder on" : "Watch folder off");
          renderApp();
        });
      }

      const processBtn = document.getElementById("processBtn");
      if (processBtn) {
        processBtn.addEventListener("click", () => {
          if (running) {
            running = false;
            // freeze processing as pending-ish visual
            items = items.map((i) =>
              i.status === "processing"
                ? { ...i, status: "pending", progress: undefined, stage: undefined }
                : i
            );
            toast("Cancelled batch");
          } else {
            running = true;
            // start first pending
            const next = sortItems(items).find((i) => i.status === "pending");
            if (next) {
              items = items.map((i) =>
                i.id === next.id
                  ? { ...i, status: "processing", progress: 8, stage: "inferring" }
                  : i
              );
              selectedId = next.id;
            }
            toast("Process folder started");
          }
          renderApp();
        });
      }

      const drawerToggle = document.getElementById("queueDrawerToggle");
      if (drawerToggle) {
        drawerToggle.addEventListener("click", () => {
          queueDrawerOpen = !queueDrawerOpen;
          toast(queueDrawerOpen ? "Queue expanded" : "Queue collapsed");
          renderApp();
        });
      }
    }

    function renderNotes() {
      const n = NOTES[option];
      const el = document.getElementById("notes");
      el.innerHTML = `
        <h2>${escapeHtml(n.title)}</h2>
        <span class="badge${n.recommended ? "" : " hidden"}">Recommended</span>
        <p class="lead">${escapeHtml(n.lead)}</p>
        <h3>Pros</h3>
        <ul class="pros">${n.pros.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul>
        <h3>Cons</h3>
        <ul class="cons">${n.cons.map((c) => `<li>${escapeHtml(c)}</li>`).join("")}</ul>
      `;
    }

    // Tabs
    document.querySelectorAll('.option-tabs [role="tab"]').forEach((tab) => {
      tab.addEventListener("click", () => {
        option = tab.getAttribute("data-opt");
        document.querySelectorAll('.option-tabs [role="tab"]').forEach((t) => {
          t.setAttribute("aria-selected", t === tab ? "true" : "false");
        });
        renderApp();
      });
    });

    // Theme
    document.getElementById("themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.getAttribute("data-theme") !== "light";
      root.setAttribute("data-theme", dark ? "light" : "dark");
      const btn = document.getElementById("themeToggle");
      btn.textContent = dark ? "Theme: Light" : "Theme: Dark";
      btn.setAttribute("aria-pressed", dark ? "false" : "true");
    });

    // Simulate run: cycle one pending → processing → done
    document.getElementById("simRun").addEventListener("click", () => {
      running = true;
      let processing = items.find((i) => i.status === "processing");
      if (processing) {
        const nextProg = Math.min(100, (processing.progress || 0) + 28);
        if (nextProg >= 100) {
          items = items.map((i) =>
            i.id === processing.id
              ? { ...i, status: "done", progress: undefined, stage: undefined }
              : i
          );
          const next = sortItems(items).find((i) => i.status === "pending");
          if (next) {
            items = items.map((i) =>
              i.id === next.id
                ? { ...i, status: "processing", progress: 12, stage: "inferring" }
                : i
            );
            selectedId = next.id;
            toast(`Done → now ${next.name}`);
          } else {
            running = false;
            toast("Batch complete");
          }
        } else {
          const stage = nextProg < 40 ? "loading" : nextProg < 85 ? "inferring" : "writing";
          items = items.map((i) =>
            i.id === processing.id ? { ...i, progress: nextProg, stage } : i
          );
          toast(`${processing.name}: ${nextProg}% · ${stage}`);
        }
      } else {
        const next = sortItems(items).find((i) => i.status === "pending");
        if (!next) {
          toast("Nothing left to process");
          running = false;
        } else {
          items = items.map((i) =>
            i.id === next.id
              ? { ...i, status: "processing", progress: 15, stage: "inferring" }
              : i
          );
          selectedId = next.id;
          toast(`Simulating: ${next.name}`);
        }
      }
      renderApp();
    });

    renderApp();
  </script>
</body>
</html>
