<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwiftMask · Spanish locale review</title>
<style>
:root {
  --bg: #f4f4f5;
  --surface: #fff;
  --text: #18181b;
  --muted: #71717a;
  --border: #e4e4e7;
  --accent: #2563eb;
  --same: #a16207;
  --same-bg: #fef9c3;
  --token: #b91c1c;
  --token-bg: #fee2e2;
  --sticky: #fafafa;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --radius: 10px;
  --pad: 12px;
  --tap: 44px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --text: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --accent: #60a5fa;
    --same: #facc15;
    --same-bg: #422006;
    --token: #fca5a5;
    --token-bg: #450a0a;
    --sticky: #111113;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font: 15px/1.45 var(--sans);
  color: var(--text);
  background: var(--bg);
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--sticky);
  border-bottom: 1px solid var(--border);
  padding: 10px var(--pad) 12px;
  box-shadow: var(--shadow);
}
h1 {
  margin: 0 0 8px;
  font-size: 1.05rem;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.toolbar {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  font-size: 0.85rem;
  color: var(--muted);
}
.meta strong { color: var(--text); font-weight: 600; }
.search {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.search:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: transparent;
}
.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  font-size: 0.9rem;
  cursor: pointer;
  user-select: none;
}
.toggle input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
main { padding: 8px var(--pad) 48px; max-width: 1100px; margin: 0 auto; }
.section { margin-top: 8px; }
.section-head {
  position: sticky;
  top: 132px;
  z-index: 10;
  background: var(--sticky);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  margin: 12px 0 8px;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
}
.card.flag-same { border-left: 3px solid var(--same); }
.card.flag-token { border-left: 3px solid var(--token); }
.card.flag-same.flag-token { border-left-color: var(--token); }
.key {
  font: 0.8rem/1.3 var(--mono);
  color: var(--accent);
  word-break: break-all;
  margin-bottom: 8px;
}
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 8px; }
.badge {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  line-height: 1.4;
}
.badge.same { background: var(--same-bg); color: var(--same); }
.badge.token { background: var(--token-bg); color: var(--token); }
.langs { display: grid; gap: 8px; }
.lang {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--bg);
}
.lang-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 4px;
}
.lang-val {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.95rem;
}
.lang-val.empty { color: var(--muted); font-style: italic; }
.empty-state {
  text-align: center;
  color: var(--muted);
  padding: 40px 16px;
}
@media (min-width: 720px) {
  .langs { grid-template-columns: 1fr 1fr; }
  .toolbar { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 280px; max-width: 420px; }
  .section-head { top: 96px; }
}
</style>
</head>
<body>
<header>
  <h1>SwiftMask · Spanish locale review</h1>
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="Filter by key or text…" autocomplete="off" enterkeyhint="search">
    <label class="toggle"><input type="checkbox" id="hideSame"> Hide EN === ES</label>
    <div class="meta">
      <span>Total: <strong id="total">0</strong></span>
      <span>Showing: <strong id="shown">0</strong></span>
      <span>Same as EN: <strong id="sameCount">0</strong></span>
      <span>Token mismatch: <strong id="tokenCount">0</strong></span>
    </div>
  </div>
</header>
<main id="main"></main>

function flatten(obj, prefix = "", out = []) {
  for (const [k, v] of Object.entries(obj)) {
    const path = prefix ? prefix + "." + k : k;
    if (v !== null && typeof v === "object" && !Array.isArray(v)) flatten(v, path, out);
    else out.push({ key: path, section: path.split(".")[0], en: String(v ?? ""), es: "" });
  }
  return out;
}

function getPath(obj, path) {
  return path.split(".").reduce((a, k) => (a == null ? undefined : a[k]), obj);
}

function tokens(s) {
  const m = String(s).match(/\{\{[^}]+\}\}/g);
  return m ? m.slice().sort() : [];
}

function tokensMatch(a, b) {
  const ta = tokens(a), tb = tokens(b);
  if (ta.length !== tb.length) return false;
  for (let i = 0; i < ta.length; i++) if (ta[i] !== tb[i]) return false;
  return true;
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

const rows = flatten(EN).map((r) => {
  const esVal = getPath(ES, r.key);
  r.es = esVal == null ? "" : String(esVal);
  r.same = r.en === r.es;
  r.tokenMismatch = !tokensMatch(r.en, r.es);
  return r;
});

const bySection = new Map();
for (const r of rows) {
  if (!bySection.has(r.section)) bySection.set(r.section, []);
  bySection.get(r.section).push(r);
}

const totalEl = document.getElementById("total");
const shownEl = document.getElementById("shown");
const sameCountEl = document.getElementById("sameCount");
const tokenCountEl = document.getElementById("tokenCount");
const main = document.getElementById("main");
const qEl = document.getElementById("q");
const hideSameEl = document.getElementById("hideSame");

totalEl.textContent = String(rows.length);
sameCountEl.textContent = String(rows.filter((r) => r.same).length);
tokenCountEl.textContent = String(rows.filter((r) => r.tokenMismatch).length);

function render() {
  const q = qEl.value.trim().toLowerCase();
  const hideSame = hideSameEl.checked;
  let shown = 0;
  const parts = [];

  for (const [section, items] of bySection) {
    const filtered = items.filter((r) => {
      if (hideSame && r.same) return false;
      if (!q) return true;
      return (
        r.key.toLowerCase().includes(q) ||
        r.en.toLowerCase().includes(q) ||
        r.es.toLowerCase().includes(q)
      );
    });
    if (!filtered.length) continue;
    shown += filtered.length;
    parts.push(
      `<section class="section" data-section="${esc(section)}">` +
        `<div class="section-head"><span>${esc(section)}</span><span>${filtered.length}</span></div>` +
        filtered
          .map((r) => {
            const cls = ["card"];
            if (r.same) cls.push("flag-same");
            if (r.tokenMismatch) cls.push("flag-token");
            let badges = "";
            if (r.same || r.tokenMismatch) {
              badges =
                `<div class="badges">` +
                (r.same ? `<span class="badge same">same as EN</span>` : "") +
                (r.tokenMismatch ? `<span class="badge token">token mismatch</span>` : "") +
                `</div>`;
            }
            return (
              `<article class="${cls.join(" ")}">` +
              `<div class="key">${esc(r.key)}</div>` +
              badges +
              `<div class="langs">` +
              `<div class="lang"><div class="lang-label">EN</div><div class="lang-val${r.en ? "" : " empty"}">${r.en ? esc(r.en) : "—"}</div></div>` +
              `<div class="lang"><div class="lang-label">ES</div><div class="lang-val${r.es ? "" : " empty"}">${r.es ? esc(r.es) : "—"}</div></div>` +
              `</div></article>`
            );
          })
          .join("") +
        `</section>`
    );
  }

  shownEl.textContent = String(shown);
  main.innerHTML = parts.length
    ? parts.join("")
    : `<p class="empty-state">No keys match.</p>`;
}

qEl.addEventListener("input", render);
hideSameEl.addEventListener("change", render);
render();
</script>
